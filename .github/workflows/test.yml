name: test
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
env:
  NIX_EMACS_CI_REF: 0a9a83561eac8862a2e35c0cf1c239621147021c
jobs:
  test:
    name: Emacs ${{ matrix.emacs }}, ${{ matrix.task }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        emacs: ["30.1", "31.1"]
        task: [check, test-podman, test-distrobox, test-nix]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: emacs-ci
      - name: Install Emacs
        env:
          VERSION: ${{ matrix.emacs }}
        run: nix profile install "github:purcell/nix-emacs-ci/$NIX_EMACS_CI_REF#emacs-${VERSION//./-}"
      - uses: extractions/setup-just@v3
      - if: matrix.task != 'check'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: matrix.task == 'test-distrobox'
        run: nix profile install nixpkgs#distrobox
      - run: just ${{ matrix.task }}
